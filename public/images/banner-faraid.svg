<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img" aria-label="Ilustrasi timbangan keadilan emas dan kitab faraid">
  <defs>
    <linearGradient id="bn-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DCA8"/>
      <stop offset="50%" stop-color="#D8B66A"/>
      <stop offset="100%" stop-color="#8A6D33"/>
    </linearGradient>
    <linearGradient id="bn-gold-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8CE93"/>
      <stop offset="100%" stop-color="#A9823C"/>
    </linearGradient>
    <linearGradient id="bn-cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123D32"/>
      <stop offset="100%" stop-color="#0B2C22"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#D8B66A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D8B66A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="150" cy="80" rx="105" ry="72" fill="url(#bn-glow)"/>

  <!-- Kitab bersampul hijau-emas -->
  <g>
    <rect x="168" y="70" width="74" height="52" rx="6" fill="url(#bn-cover)"/>
    <rect x="168" y="70" width="8" height="52" rx="3" fill="url(#bn-gold)"/>
    <rect x="186" y="82" width="40" height="4" rx="2" fill="#D8B66A" opacity="0.9"/>
    <rect x="186" y="92" width="30" height="3" rx="1.5" fill="#D8B66A" opacity="0.55"/>
    <rect x="186" y="100" width="34" height="3" rx="1.5" fill="#D8B66A" opacity="0.55"/>
    <rect x="163" y="122" width="86" height="7" rx="3.5" fill="#8A6D33"/>
  </g>

  <!-- Timbangan emas -->
  <g>
    <rect x="92" y="34" width="6" height="86" rx="3" fill="url(#bn-gold-v)"/>
    <circle cx="95" cy="31" r="7" fill="url(#bn-gold)"/>
    <path d="M42 44h106" stroke="url(#bn-gold)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M42 46l-13 32M42 46l13 32M148 46l-13 32M148 46l13 32" stroke="#D8B66A" stroke-width="1.6" opacity="0.85"/>
    <path d="M20 78a22 11 0 0 0 44 0Z" fill="url(#bn-gold)"/>
    <path d="M126 78a22 11 0 0 0 44 0Z" fill="url(#bn-gold)"/>
    <path d="M78 120h34l-9 14H87Z" fill="#8A6D33"/>
    <rect x="62" y="134" width="66" height="7" rx="3.5" fill="#8A6D33"/>
  </g>

  <!-- Bintang ornamen -->
  <path d="M36 26l3.5 8 8 3.5-8 3.5-3.5 8-3.5-8-8-3.5 8-3.5Z" fill="#D8B66A" opacity="0.7"/>
  <circle cx="238" cy="34" r="3" fill="#D8B66A" opacity="0.55"/>
</svg>
